<section class="container py-5">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h1 class="h3 mb-1 text-white">Dashboard</h1>
      <p class="text-white-50 mb-0">Vista basica de administracion</p>
    </div>
    <button class="btn btn-primary" (click)="navigateToAlta()">Nuevo artículo</button>
  </div>

  <div class="row g-3">
    <div class="col-12 col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="h6 text-uppercase text-muted">Articulos publicados</h2>
          <p class="display-6 mb-0">--</p>
        </div>
      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="h6 text-uppercase text-muted">Visitas totales</h2>
          <p class="display-6 mb-0">--</p>
        </div>
      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="h6 text-uppercase text-muted">Comentarios nuevos</h2>
          <p class="display-6 mb-0">--</p>
        </div>
      </div>
    </div>
  </div>

  <div class="card mt-4">
    <div class="card-header">Actividad reciente</div>
    <div class="card-body">
      <table class="table table-hover">
        <thead>
          <tr>
            <th scope="col">Articulo</th>
            <th scope="col">Título</th>
            <th scope="col">Fecha creación</th>
            <th scope="col">Estado</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let article of articles()" [class.table-success]="article.status === 'PUBLISHED'" [class.table-warning]="article.status === 'DRAFT'" [class.table-secondary]="article.status === 'ARCHIVED'">
            <th scope="row">{{ article.id }}</th>
            <td>{{ article.title }}</td>
            <td>{{ article.createdAt | date }}</td>
            <td>{{ article.status }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
