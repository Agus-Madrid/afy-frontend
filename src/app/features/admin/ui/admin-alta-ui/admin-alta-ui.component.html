<section class="container py-5">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h1 class="h3 mb-1 text-white">Alta</h1>
      <p class="text-white-50 mb-0">Vista básica de alta</p>
    </div>
    <button class="btn btn-primary">Volver</button>
  </div>

  <div class="row g-3">
    <div class="col-12 col-md-12">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="h6 text-uppercase text-muted">Creación de artículo</h2>
        </div>
      </div>
    </div>
  </div>

  <div class="card mt-4">
    <div class="card-header">Titulo</div>
    <div class="card-body"><input type="text" class="form-control" /></div>
    <div class="card-header">Descripción</div>
    <div class="card-body"><input type="text" class="form-control" /></div>
    <div class="card-header">Imagen de la card</div>
    <div class="card-body"><input type="file" id="archivo" name="archivo" accept="image/png, image/jpeg, image/webp" class="form-control" (change)="manageSelectionChange($event)"></div>
    <div class="card-header">Estado</div>
    <div class="card-body">
      <select class="form-select">
        <option>Borrador</option>
        <option>Publicado</option>
        <option>Archivado</option>
      </select>
    </div>
    <div class="card-header">Contenido</div>
    <div class="card-body">
        <app-editor></app-editor>
    </div>
  </div>
</section>
