<div style="max-width: 800px; margin: auto; min-height: 800px;" class="pt-5">
    
    <h1 class="mb-4 text-warning ">{{ article()?.title | uppercase }}</h1>    
    <div style="background-color: rgba(0, 0, 0, 0.6); padding: 2rem; padding-top:1rem; border-radius: 8px; color: white;">
        <span class="badge bg-warning-subtle border border-warning-subtle text-warning-emphasis rounded-pill mb-4 ">{{ article()?.genre?.name }}</span>
        <div [innerHTML]="article()?.content | markdown" class="content">
        </div>
    </div>
</div>
