<div class="d-flex justify-content-center align-items-center " style="min-height: 100vh; width: 100%;">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" style="width: 600px;" class="d-flex gap-4 flex-column p-4 text-white">
        <fieldset>
            <div>
                <label for="exampleInputEmail1" class="form-label mt-4">Email</label>
                <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"
                    placeholder="Enter email" formControlName="email" autocomplete="off">
            </div>
            <div>
                <label for="exampleInputPassword1" class="form-label mt-4">Password</label>
                <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Password"
                    autocomplete="off" formControlName="password">
            </div>
        </fieldset>
        <button type="submit" class="btn btn-light w-25 rounded-0" [disabled]="loginForm.invalid">Login</button>
    </form>
</div>
